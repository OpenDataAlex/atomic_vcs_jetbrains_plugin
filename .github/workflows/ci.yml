name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, static analysis, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Format and lint (spotless + ktlint)
        run: ./gradlew spotlessCheck -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Static analysis (detekt)
        run: ./gradlew detekt -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Compile with warnings as errors
        run: ./gradlew compileKotlin compileTestKotlin -PwarningsAsErrors=true -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Unit tests and coverage check
        run: ./gradlew test koverVerify koverXmlReport -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Build plugin
        run: ./gradlew buildPlugin -Dorg.gradle.java.home="$JAVA_HOME"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            build/reports/kover/report.xml
            **/build/reports/detekt/
            **/build/reports/tests/
          if-no-files-found: ignore
